replicaCount: 1

image:
  repository: ghcr.io/diamondlightsource/daq-monitoring-service
  pullPolicy: Always
  tag: "dev"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

config: []

persistence:
  enabled: true
  persistenceClaimName: daq-monitoring-service-pvc
  existingClaim: ""
  mountPath: /data
  accessModes:
    - ReadWriteOnce
  size: 100Mi

volumeMounts: []
volumes: []

nodeSelector: {}
tolerations: []

env: []

envFromSecret: "daq-monitoring-service-secrets"
